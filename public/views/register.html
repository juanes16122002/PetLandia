<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | PetLandia</title>
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="auth-body">
  <header class="site-header">
    <div class="container">
      <a href="home.html" class="brand">Pet<span>Landia</span></a>
      <nav class="main-nav">
        <a href="catalog.html">Catálogo</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-link">
          🛒
          <span class="cart-badge" id="cart-badge"></span>
        </a>
        <div id="user-area"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="auth-card card wide">
      <h1 class="auth-title">Crear cuenta</h1>
      <div id="error-container"></div>

      <form id="register-form" novalidate>
        <div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono <span class="text-muted">(opcional)</span></label>
          <input type="tel" id="telefono" class="form-control">
        </div>

        <div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="form-control" minlength="8" autocomplete="new-password" required>
            <div class="form-hint">Mínimo 8 caracteres</div>
          </div>
          <div class="form-group">
            <label for="password_confirmation">Confirmar contraseña</label>
            <input type="password" id="password_confirmation" class="form-control" autocomplete="new-password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="register-btn">Registrarme</button>
      </form>

      <p class="text-center" style="margin-top:16px;">
        ¿Ya tienes cuenta? <a href="login.html" style="color:var(--color-primary);font-weight:600;">Ingresa</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 PetLandia</span>
      <span>🧡 Productos para mascotas</span>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
