<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | PetLandia</title>
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/catalog.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="home.html" class="brand">Pet<span>Landia</span></a>
      <nav class="main-nav">
        <a href="catalog.html">Catálogo</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-link">
          🛒
          <span class="cart-badge" id="cart-badge"></span>
        </a>
        <div id="user-area"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <h1 class="page-title">Catálogo de productos</h1>
    <p class="page-subtitle">Todo para tu mascota, en un solo lugar.</p>

    <section class="catalog-layout">
      <!-- Filtros -->
      <aside class="filters card">
        <h2 class="card-title">Filtros</h2>
        <div class="form-group">
          <label for="filter-search">Buscar</label>
          <input type="text" id="filter-search" class="form-control" placeholder="Ej: alimento">
        </div>
        <div class="form-group">
          <label for="filter-category">Categoría</label>
          <select id="filter-category" class="form-control">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filter-order">Ordenar por</label>
          <select id="filter-order" class="form-control">
            <option value="p.nombre|ASC">Nombre (A-Z)</option>
            <option value="p.nombre|DESC">Nombre (Z-A)</option>
            <option value="p.precio|ASC">Precio (menor)</option>
            <option value="p.precio|DESC">Precio (mayor)</option>
          </select>
        </div>
        <button id="filter-apply" class="btn btn-primary btn-block">Aplicar filtros</button>
        <button id="filter-reset" class="btn btn-ghost btn-block" style="margin-top:8px;">Limpiar</button>
      </aside>

      <!-- Listado -->
      <div>
        <div class="result-info text-muted" id="result-info"></div>

        <div id="loader" class="loader"><div class="spinner"></div></div>

        <div id="products-container" class="products-grid"></div>

        <div id="error-container"></div>

        <div id="pagination" class="pagination"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 PetLandia</span>
      <span>🧡 Productos para mascotas</span>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/products.js"></script>
</body>
</html>
