<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos | PetLandia Admin</title>
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-topbar">
      <a href="dashboard.html" class="admin-brand">Pet<span>Landia</span><em>Admin</em></a>
      <nav class="admin-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="orders.html" class="active">Pedidos</a>
        <a href="products.html">Productos</a>
        <a href="inventory.html">Inventario</a>
      </nav>
      <div class="admin-user">
        <span class="admin-user-name">
          <span id="admin-user-name"></span>
          <span class="admin-user-role" id="admin-user-role"></span>
        </span>
        <a href="../home.html" class="btn btn-ghost">Ver tienda</a>
        <button class="btn btn-outline" id="admin-logout" type="button">Salir</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div id="admin-error"></div>

    <h1 class="page-title">Pedidos</h1>
    <p class="page-subtitle">Consulta y gestiona los pedidos de los clientes.</p>

    <div class="toolbar">
      <select id="filter-estado" class="form-control">
        <option value="">Todos los estados</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="PAGADO">Pagado</option>
        <option value="RECHAZADO">Rechazado</option>
      </select>
      <button class="btn btn-outline" id="filter-apply" type="button">Filtrar</button>
      <div class="right">
        <button class="btn btn-ghost" id="orders-reload" type="button">Recargar</button>
      </div>
    </div>

    <div class="card table-card" id="orders-table"></div>

    <div id="order-modal"></div>
  </main>

  <footer class="admin-footer">© 2026 PetLandia · Panel de administración</footer>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => AdminOrders.init());</script>
</body>
</html>
