<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | PetLandia</title>
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="auth-body">
  <header class="site-header">
    <div class="container">
      <a href="home.html" class="brand">Pet<span>Landia</span></a>
      <nav class="main-nav">
        <a href="catalog.html">Catálogo</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-link">
          🛒
          <span class="cart-badge" id="cart-badge"></span>
        </a>
        <div id="user-area"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="auth-card card">
      <h1 class="auth-title">Iniciar sesión</h1>
      <div id="error-container"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Ingresar</button>
      </form>

      <p class="text-center" style="margin-top:16px;">
        ¿No tienes cuenta? <a href="register.html" style="color:var(--color-primary);font-weight:600;">Regístrate</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 PetLandia</span>
      <span>🧡 Productos para mascotas</span>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
